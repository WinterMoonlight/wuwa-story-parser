[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwa-story-parser"
version = "0.1.0"
description = "Read-only Wuthering Waves story configuration parser"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wuwa-story = "wuwa_story.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
