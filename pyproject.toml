[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwa-story-parser"
version = "0.1.0"
description = "Read-only Wuthering Waves story configuration parser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/WinterMoonlight/wuwa-story-parser"
Issues = "https://github.com/WinterMoonlight/wuwa-story-parser/issues"

[project.scripts]
wuwa-story = "wuwa_story.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wuwa_story*"]
