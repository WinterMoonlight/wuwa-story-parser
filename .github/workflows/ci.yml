name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check syntax and documentation links
        run: python scripts/check_project.py
      - name: Run tests that do not need game data
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/unit -v
      - name: Verify package and command entry point
        run: |
          python -m pip install --no-deps .
          wuwa-story --help
